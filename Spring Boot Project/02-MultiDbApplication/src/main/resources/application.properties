spring.application.name=02-MultiDbApplication

# H2 DATABASE
app.datasource.h2.jdbc-url=jdbc:h2:mem:h2db;DB_CLOSE_DELAY=-1
app.datasource.h2.username=sa
app.datasource.h2.password=
app.datasource.h2.driver-class-name=org.h2.Driver

# MYSQL DATABASE
app.datasource.mysql.jdbc-url=jdbc:mysql://localhost:3306/studentdb
app.datasource.mysql.username=root
app.datasource.mysql.password=root
app.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 CONSOLE
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console